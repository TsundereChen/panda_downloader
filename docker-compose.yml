services:
  eh-telegram-archive:
    build: .
    image: eh-telegram-archive:local
    env_file: .env
    environment:
      DOWNLOAD_DIR: /downloads
    volumes:
      - ./downloads:/downloads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
