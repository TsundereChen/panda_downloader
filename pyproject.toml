[project]
name = "eh-telegram-archive"
version = "0.1.0"
description = "Private Telegram bot for E-Hentai and ExHentai archive downloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5.0",
  "httpx[http2]>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "python-telegram-bot>=21.0,<23.0",
]

[project.optional-dependencies]
login = [
  "pywebview>=5.4,<7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<10.0",
]
